<!DOCTYPE html>
<html>

<head>
    <title>Smart Police Map</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f7fe;
        }

        h2 {
            padding: 10px;
            margin: 0;
        }

        #controls {
            padding: 10px;
            display: flex;
            gap: 10px;
            background: white;
        }

        select,
        button {
            padding: 6px;
        }

        button {
            cursor: pointer;
            background: #3498db;
            color: white;
            border: none;
        }

        #map {
            height: 550px;
            width: 100%;
        }
    </style>
</head>

<body>

    <h2>🚓 Smart Police System Map</h2>

    <div id="controls">

        <select id="regionFilter">
            <option value="all">All Regions</option>
            <option value="beirut">Beirut</option>
            <option value="saida">Saida</option>
            <option value="tyre">Tyre</option>
        </select>

        <select id="typeFilter">
            <option value="all">All Types</option>
            <option value="police">Police</option>
            <option value="alert">Alerts</option>
            <option value="route">Routes</option>
            <option value="zone">Zones</option>
        </select>

        <button onclick="applyFilters()">Apply Filter</button>
        <button onclick="showAll()">Show All</button>

    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>

        // ================= MAP =================
        var map = L.map('map').setView([33.8938, 35.5018], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // ================= ICONS =================
        var policeIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/149/149060.png',
            iconSize: [30, 30]
        });

        var alertIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/564/564619.png',
            iconSize: [30, 30]
        });

        // ================= REGIONS =================
        var regions = {
            beirut: [33.8938, 35.5018],
            saida: [33.56, 35.37],
            tyre: [33.27, 35.20]
        };

        // ================= LAYERS =================
        var policeLayer = L.layerGroup().addTo(map);
        var alertLayer = L.layerGroup().addTo(map);
        var routeLayer = L.layerGroup().addTo(map);
        var zoneLayer = L.layerGroup().addTo(map);

        // ================= DATA =================
        var items = [
            { type: "police", region: "beirut", coords: [33.8938, 35.5018], popup: "Police Beirut" },
            { type: "alert", region: "saida", coords: [33.56, 35.37], popup: "Alert Saida" },
            { type: "alert", region: "tyre", coords: [33.27, 35.20], popup: "Alert Tyre" },

            {
                type: "route",
                region: "beirut",
                coords: [
                    [33.8938, 35.5018],
                    [33.8800, 35.5200],
                    [33.8500, 35.5300]
                ]
            },

            {
                type: "zone",
                region: "beirut",
                center: [33.87, 35.50],
                radius: 1500
            }
        ];

        // ================= DRAW FUNCTION =================
        function drawItems(list) {

            policeLayer.clearLayers();
            alertLayer.clearLayers();
            routeLayer.clearLayers();
            zoneLayer.clearLayers();

            list.forEach(item => {

                if (item.type === "police") {
                    L.marker(item.coords, { icon: policeIcon })
                        .bindPopup(item.popup)
                        .addTo(policeLayer);
                }

                if (item.type === "alert") {
                    L.marker(item.coords, { icon: alertIcon })
                        .bindPopup(item.popup)
                        .addTo(alertLayer);
                }

                if (item.type === "route") {
                    L.polyline(item.coords, {
                        color: 'blue',
                        weight: 5
                    }).addTo(routeLayer);
                }

                if (item.type === "zone") {
                    L.circle(item.center, {
                        color: 'green',
                        fillOpacity: 0.3,
                        radius: item.radius
                    }).addTo(zoneLayer);
                }

            });
        }

        // ================= FILTER (FIXED + CLEAN) =================
        function applyFilters() {

            var region = document.getElementById("regionFilter").value;
            var type = document.getElementById("typeFilter").value;

            var filtered = items.filter(item => {

                var regionMatch = (region === "all" || item.region === region);
                var typeMatch = (type === "all" || item.type === type);

                return regionMatch && typeMatch;
            });

            drawItems(filtered);

            // 📍 zoom control
            if (region !== "all") {
                map.setView(regions[region], 12);
            } else {
                map.setView([33.8938, 35.5018], 11);
            }
        }

        // ================= SHOW ALL (FIXED) =================
        function showAll() {

            document.getElementById("regionFilter").value = "all";
            document.getElementById("typeFilter").value = "all";

            drawItems(items);
            map.setView([33.8938, 35.5018], 11);
        }

        // ================= CLICK ADD ALERT =================
        map.on('click', function (e) {

            var newItem = {
                type: "alert",
                region: "beirut",
                coords: [e.latlng.lat, e.latlng.lng],
                popup: "🚨 New Alert"
            };

            items.push(newItem);
            drawItems(items);
        });

        // ================= LAYER CONTROL =================
        L.control.layers(null, {
            "🚓 Police": policeLayer,
            "⚠️ Alerts": alertLayer,
            "🛣 Routes": routeLayer,
            "🟢 Zones": zoneLayer
        }).addTo(map);

        // ================= INITIAL LOAD =================
        drawItems(items);

    </script>

</body>

</html>
